spring:
  application:
    name: afrismart
  datasource:
    url: ${AFRISMART_DB_URL:jdbc:h2:mem:afrismart;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:30s}

server:
  port: ${PORT:${SERVER_PORT:8087}}
  shutdown: ${SERVER_SHUTDOWN:graceful}
  tomcat:
    # Media uploads arrive as JSON base64; default 2MB post limit drops/crashes large photos & videos.
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Keep health cheap so Vercel probes don't time out mid cold-start.
      show-details: when_authorized
  health:
    diskspace:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

afrismart:
  jwt:
    issuer: AfriSmart
    secret: ${AFRISMART_JWT_SECRET:local-only-change-me-afrismart-jwt-hs256-key}
    ttl: 24h
  search:
    default-radius-meters: 15000
    max-results: 50
  clock:
    zone: Africa/Lagos
  # Live: empty DB — people register and create their own shops/products. Tests set seed=true.
  demo:
    seed: ${AFRISMART_DEMO_SEED:false}
  ai:
    engine: ${AFRISMART_AI_ENGINE:OPENAI}
    max-tool-rounds: 6
    history-window: 12
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      timeout: 60s
